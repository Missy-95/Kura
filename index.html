<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#000} body{margin:0} img{max-width:100%} [hidden]{display:none!important}
.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:70;display:flex;gap:12px;align-items:center;background:#f6f3fa;color:#141019;padding:10px 10px 10px 18px;border-radius:999px;font:500 14px "Onest","Zen Kaku Gothic New",system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:nowrap}
.upd button{background:#141019;color:#f6f3fa;border:0;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone-width column floating over a living colour field that shifts per tab; glass cards, floating pill nav. Dark by design. */
:root{
  color-scheme:dark;
  --bg:#130f1b;
  --bg-deep:#0d0a13;
  --fg:#f6f3fa;
  --fg-2:rgba(246,243,250,.70);
  --fg-3:rgba(246,243,250,.46);
  --glass:rgba(22,18,32,.34);
  --glass-2:rgba(255,255,255,.13);
  --glass-3:rgba(255,255,255,.2);
  --line:rgba(255,255,255,.09);
  --accent:#f4c542;
  --violet:#9c8bff;
  --good:#63d6a4;
  --bad:#ff7c6e;
  --warn:#f5a94a;
  --ink:#141019;
  --b1:#7b3bf5;--b2:#f5e04a;--b3:#ff6fb0;--base:#3a1d9e;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --brand:"Onest",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  --jp:var(--font);
  --r-xl:30px;--r-lg:22px;--r-md:16px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@property --b1{syntax:'<color>';inherits:true;initial-value:#7b3bf5}
@property --b2{syntax:'<color>';inherits:true;initial-value:#f5e04a}
@property --b3{syntax:'<color>';inherits:true;initial-value:#ff6fb0}
@property --base{syntax:'<color>';inherits:true;initial-value:#3a1d9e}
body{transition:--b1 1.4s ease,--b2 1.4s ease,--b3 1.4s ease,--base 1.4s ease}
body[data-tab="home"]{--base:#3a1d9e;--b1:#7b3bf5;--b2:#f5e04a;--b3:#ff6fb0}
body[data-tab="tx"]{--base:#2c1a8c;--b1:#a03cf0;--b2:#ff9d3c;--b3:#ff4f8b}
body[data-tab="insights"]{--base:#2d1a78;--b1:#5c34e6;--b2:#cfae2c;--b3:#d65a3e}
body[data-tab="assets"]{--base:#3326e8;--b1:#b6f24e;--b2:#4433f2;--b3:#b04cf2}
body[data-tab="settings"]{--base:#25205e;--b1:#6c4ce6;--b2:#46c2e0;--b3:#c25cb6}
body.locked{--base:#2b176c;--b1:#d2b034;--b2:#e3cb3e;--b3:#8a3cf0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.tnum{font-variant-numeric:tabular-nums}

/* colour field */
.mesh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--base)}
.blob{position:absolute;border-radius:50%;will-change:transform}
.blob.a{width:120vmax;height:120vmax;left:-62vmax;top:-70vmax;background:radial-gradient(closest-side,var(--b1) 0%,var(--b1) 45%,transparent 100%);animation:drift1 13s ease-in-out infinite alternate}
.blob.b{width:100vmax;height:100vmax;right:-48vmax;top:-46vmax;background:radial-gradient(closest-side,var(--b2) 0%,var(--b2) 45%,transparent 100%);animation:drift2 16s ease-in-out infinite alternate}
.blob.c{width:70vmax;height:70vmax;left:-24vmax;top:12vmax;background:radial-gradient(closest-side,var(--b3) 0%,var(--b3) 38%,transparent 100%);opacity:.85;animation:drift3 11s ease-in-out infinite alternate}
.blob.d{width:90vmax;height:90vmax;right:-44vmax;bottom:-40vmax;background:radial-gradient(closest-side,var(--b2) 0%,var(--b2) 40%,transparent 100%);opacity:.9;animation:drift4 18s ease-in-out infinite alternate}
.blob.e{width:60vmax;height:60vmax;right:-14vmax;top:24vmax;background:radial-gradient(closest-side,var(--b1) 0%,var(--b1) 36%,transparent 100%);opacity:.8;animation:drift5 14s ease-in-out infinite alternate}
.blob.f{width:54vmax;height:54vmax;left:-10vmax;bottom:-12vmax;background:radial-gradient(closest-side,var(--b3) 0%,var(--b3) 34%,transparent 100%);opacity:.7;animation:drift6 12s ease-in-out infinite alternate}
.mesh::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,12,24,0) 0%,rgba(16,12,24,0) 34%,rgba(16,12,24,.34) 60%,rgba(12,9,18,.6) 100%);transition:opacity 1s ease}
body.locked .mesh::after{opacity:.4}
@keyframes drift1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(20vmax,14vmax) scale(1.12)}100%{transform:translate(6vmax,30vmax) scale(.92)}}
@keyframes drift2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-22vmax,18vmax) scale(.9)}100%{transform:translate(-8vmax,34vmax) scale(1.08)}}
@keyframes drift3{0%{transform:translate(0,0) scale(1)}50%{transform:translate(26vmax,-10vmax) scale(1.2)}100%{transform:translate(10vmax,18vmax) scale(.88)}}
@keyframes drift4{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-18vmax,-22vmax) scale(1.1)}100%{transform:translate(-30vmax,-8vmax) scale(.94)}}
@keyframes drift5{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-24vmax,12vmax) scale(.86)}100%{transform:translate(-10vmax,-14vmax) scale(1.14)}}
@keyframes drift6{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18vmax,-16vmax) scale(1.16)}100%{transform:translate(30vmax,-4vmax) scale(.9)}}
@media (prefers-reduced-motion:reduce){.blob{animation-duration:50s}*{transition:none!important}}
#splash{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .7s ease}
#splash .word{font:700 54px/1 var(--brand);letter-spacing:-.045em;color:#fff;animation:splashIn .8s cubic-bezier(.2,.7,.2,1) both}
#splash .word span{color:var(--accent)}
#splash.out{opacity:0;pointer-events:none}
@keyframes splashIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* shell */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px;min-height:100%}
.top{display:flex;align-items:center;gap:10px;padding-block:6px 4px}
.circle{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font-weight:600;font-size:15px}
.circle svg{width:21px;height:21px}
.circle.dot{position:relative}
.circle.dot::after{content:"";position:absolute;top:2px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px rgba(19,15,27,.4)}
.search{flex:1;min-width:0;height:46px;border-radius:999px;display:flex;align-items:center;gap:9px;padding-inline:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--fg-2);text-align:left}
.search svg{width:19px;height:19px;flex:none}
.sample{display:flex;justify-content:center;padding-top:10px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px;color:var(--fg-2)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}

.hero{text-align:center;padding-block:46px 22px}
.hero .lbl{font-size:14px;color:var(--fg-2);letter-spacing:.02em}
h1.pg,.hero .big,.hero .lbl,.hero .sub{text-shadow:0 1px 18px rgba(0,0,0,.18)}
.hero .big{font-size:clamp(44px,13vw,60px);font-weight:700;letter-spacing:-.03em;line-height:1.08;margin-top:4px}
.hero .big small{font-size:.5em;font-weight:600;opacity:.85;margin-right:2px}
.hero .sub{margin-top:6px;font-size:14px;color:var(--fg-2)}
.hero .sub b{font-weight:600}
.hero .chip{margin-top:18px;display:inline-flex;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:500}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:6px 22px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;font-weight:500}
.act span:first-child{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.act svg{width:24px;height:24px}

.card{background:var(--glass);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border-radius:var(--r-xl);padding:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ctitle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.ctitle h3{margin:0;font-size:15px;font-weight:600}
.ctitle .more{font-size:14px;color:var(--violet);font-weight:500}
.eyebrow{font-size:13px;color:var(--fg-2)}
.val{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}
.pos{color:var(--good)}
.neg{color:var(--bad)}
h1.pg{font-size:36px;font-weight:700;letter-spacing:-.025em;margin:18px 0 6px;text-wrap:balance}
.pgsub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.booksw{display:inline-flex;align-items:center;gap:6px;font-size:19px;font-weight:600}
.booksw svg{width:18px;height:18px;opacity:.75}
.monthsw{display:flex;align-items:center;gap:4px;color:var(--violet);font-weight:500;font-size:14.5px}
.monthsw button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--fg-2)}
.monthsw button:disabled{opacity:.3;cursor:default}
.monthsw svg{width:16px;height:16px}

/* banner */
.banner{display:flex;gap:14px;align-items:flex-start}
.banner .ic{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.banner .ic svg{width:24px;height:24px;color:var(--warn)}
.banner h4{margin:0;font-size:16px;font-weight:600}
.banner p{margin:2px 0 0;color:var(--fg-2);font-size:14px}
.banner .x{margin-left:auto;color:var(--fg-3);width:28px;height:28px;display:grid;place-items:center;flex:none}
.banner .x svg{width:16px;height:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:999px;background:var(--fg);color:var(--ink);font-weight:600;font-size:15.5px;width:100%}
.btn.ghost{background:rgba(255,255,255,.12);color:var(--fg)}
.btn.danger{background:rgba(255,124,110,.16);color:var(--bad)}
.btn.sm{height:40px;font-size:14px;width:auto;padding-inline:18px}
.btn:disabled{opacity:.45;cursor:default}
.mt{margin-top:16px}

/* budget meter */
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter i.over{background:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--fg-2);margin-top:8px}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:10px 0;width:100%;text-align:left}
.av{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;background:rgba(255,255,255,.11);position:relative;font-family:var(--jp)}
.av .badge{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;font-size:9.5px;display:grid;place-items:center;font-family:var(--font);font-weight:700;box-shadow:0 0 0 2px var(--bg);color:#fff}
.row .main{flex:1;min-width:0}
.row .t1,.row .t2{display:block}
.row .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-size:12.5px;font-weight:400;color:var(--fg-3)}
.row .chev{color:var(--fg-3);width:18px;height:18px;flex:none}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;background:rgba(245,169,74,.18);color:var(--warn);font-weight:500;margin-left:6px;vertical-align:1px}
.daygrp{font-size:13px;color:var(--fg-3);margin:16px 4px 2px;display:flex;justify-content:space-between}
.daygrp:first-child{margin-top:0}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.wrapchips{flex-wrap:wrap;overflow:visible;margin-bottom:0}
.chipb[data-pre][aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.chipb{flex:none;padding:8px 15px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px;font-weight:500;color:var(--fg-2)}
.chipb[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.field{display:flex;align-items:center;gap:10px;height:48px;border-radius:999px;background:rgba(255,255,255,.1);padding-inline:16px;margin-bottom:12px}
.field svg{width:18px;height:18px;color:var(--fg-3);flex:none}
.field input{flex:1;min-width:0;background:none;border:0;outline:none;height:100%}

/* charts */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--fg-3);font-size:19px;font-family:var(--font)}
.chart .lab{fill:var(--fg-2);font-size:19px;font-weight:500}
.chart .grid{stroke:rgba(255,255,255,.07);stroke-width:1.5}
.tip{position:absolute;top:0;pointer-events:none;background:rgba(20,16,28,.92);border-radius:12px;padding:8px 11px;font-size:12.5px;line-height:1.45;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08);transform:translateX(-50%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--fg-2);margin-bottom:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:16px;height:3px;border-radius:2px;display:block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--fg-3) 0 4px,transparent 4px 7px)}
.minibars{display:flex;align-items:flex-end;gap:7px;height:84px;margin-top:16px}
.minibars div{flex:1;border-radius:6px 6px 3px 3px;background:rgba(255,255,255,.18);position:relative;min-height:4px}
.minibars div.cur{background:var(--accent)}
.minibars div.negb{background:var(--bad)}
.minibars div.posb{background:var(--good)}
.minibars div:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(20,16,28,.95);padding:4px 8px;border-radius:8px;font-size:12px;white-space:nowrap;z-index:2}
.catrow{padding:9px 0}
.catrow .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.catrow .nm{font-weight:500}
.catrow .nm em{font-style:normal;font-size:12.5px;color:var(--bad);margin-left:6px;font-weight:500}
.catrow .amt{font-weight:600;white-space:nowrap}
.catrow .amt small{font-weight:400;color:var(--fg-3);font-size:12.5px}
.catrow .meter{margin-top:7px;height:6px}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;width:min(488px,calc(100% - 2 * max(16px,env(safe-area-inset-left,0px))));display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:999px;background:rgba(20,19,24,.8);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 12px 32px rgba(0,0,0,.3)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.74);transition:background-color .25s ease,color .25s ease}
.nav button svg{width:26px;height:26px;stroke-width:2.1}
.nav button[aria-current="page"]{background:rgba(255,255,255,.11);color:#fff}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(6,4,10,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{width:100%;max-width:520px;max-height:90%;overflow-y:auto;background:#1d1727;border-radius:30px 30px 0 0;padding:10px max(20px,env(safe-area-inset-left,0px)) calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .22s ease;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.scrim.on .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:99px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.sheet h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0 4px;text-wrap:balance}
.sheet .lead{color:var(--fg-2);margin:0 0 18px;font-size:14.5px}
.sheet h5{font-size:13px;color:var(--fg-3);font-weight:500;margin:20px 0 8px;letter-spacing:.03em}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--fg-2)}

const MEM = {};
function lsGet(k){ try{ const v = localStorage.getItem(k); return v; }catch(e){ noStore = true; return MEM[k] ?? null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ noStore = true; MEM[k]=v; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){ delete MEM[k]; } }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = () => (S && S.lang) || readMeta().lang || 'ja';
function t(k, ...a){ const d = I[L()] || I.ja; const v = d[k] ?? I.ja[k] ?? k; return typeof v === 'function' ? v(...a) : v; }
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const mk = s => s.slice(0,7);
const addMonths = (key, n) => { const [y,m] = key.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const daysIn = key => { const [y,m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const daysBetween = (a,b) => Math.round((b - a) / 86400000);
function yen(n, sign){ const s = Math.round(Math.abs(n)).toLocaleString('ja-JP'); return (n < 0 ? '−' : (sign && n > 0 ? '+' : '')) + '¥' + s; }
function monthLabel(key){ const [y,m] = key.split('-').map(Number); return L()==='en' ? new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}) : `${y}年${m}月`; }
function dayLabel(s){ const d = pd(s); const td = today0(); const diff = daysBetween(d, td);
  if (diff === 0) return L()==='en' ? 'Today' : '今日'; if (diff === 1) return L()==='en' ? 'Yesterday' : '昨日';
  return L()==='en' ? d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) : `${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`; }
const cat = id => S.categories.find(c => c.id === id) || S.categories.find(c => c.id === 'uncat');
const catName = id => { const c = cat(id); return c ? (L()==='en' ? c.en : c.ja) : id; };
const acct = id => S.accounts.find(a => a.id === id);
const bookName = b => t(b);
const memberName = (book, id) => { const m = (S.books[book]?.members || []).find(x => x.id === id); return m ? (L()==='en' ? m.en : m.ja) : ''; };
const isXfer = x => cat(x.cat)?.type === 'xfer';
const isExp = x => x.amt < 0 && !isXfer(x);
const isInc = x => x.amt > 0 && !isXfer(x);
const txIn = (book, key) => S.tx.filter(x => x.book === book && (!key || mk(x.date) === key));
const sum = (arr, f = x => x) => arr.reduce((a,x) => a + f(x), 0);
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); }
function readMeta(){ try { return JSON.parse(lsGet(META) || '{}'); } catch(e){ return {}; } }
function writeMeta(m){ lsSet(META, JSON.stringify({ ...readMeta(), ...m })); }

const TE = new TextEncoder(), TD = new TextDecoder();

/* Vault v2: the data is encrypted with a random data key (DEK).

/* ---------- Face ID / Touch ID via passkey (WebAuthn PRF) ---------- */
const inFrame = (() => { try { return window.top !== window.self; } catch(e){ return true; } })();
async function prfKey(out){
  const base = await crypto.subtle.importKey('raw', out, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'HKDF', hash:'SHA-256', salt:TE.encode('kura-vault-v2'), info:TE.encode('dek-wrap') }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);

  if (!WRAP.prfSalt) WRAP.prfSalt = b64e(crypto.getRandomValues(new Uint8Array(32)));
  const salt = b64d(WRAP.prfSalt);
  let credId, out;
  if (mode === 'existing') {
    const r = await prfGet(null, salt); credId = r.id; out = r.out;
  } else {
    const cred = await navigator.credentials.create({ publicKey:{
      rp:{ name:'Kura' }, user:{ id:crypto.getRandomValues(new Uint8Array(16)), name:'kura', displayName:'Kura 家計簿' },

}
function bioErrorText(e){
  if (e && e.name === 'NotHere') return t('bioNoHere');

  if (e && e.name === 'Dup') return t('pkDup');
  if (e && e.name === 'InvalidStateError') return t('pkDup');
  if (e && (e.name === 'NotAllowedError' || e.name === 'AbortError')) return t('bioCancel');

}

  const m = $('#lockmsg');

    if (!auto && m) { m.classList.remove('err'); m.textContent = ''; }
    $('#avatar')?.classList.add('scan');
    const w = wrapsFrom(v);

    const pk = w.pks.find(p => p.cred === r.id); if (!pk) throw new Error('unknown');

/* ---------- migrations: each step upgrades the data one schema version ---------- */
const MIGRATIONS = {
  // v1 → v2: add the read flag. Entries that came from a CSV start as unreviewed.
  1: s => { s.tx.forEach(x => { if (x.rev === undefined) x.rev = !(x.src === 'mf' || x.src === 'csv'); }); return s; },
  // v2 → v3: example amounts become 0. Only values still equal to the old examples are touched, so real entries stay.
  2: s => {
    const BUD = { food:48000, daily:8000, home:115000, util:12000, phone:8000, transit:10000, social:20000, outdoor:18000, beauty:12000, health:5000, learn:5000, subs:4000, travel:25000, other:8000 };
    const BAL = { smbc:1284300, rakutenbank:412880, cash:23400, paypay:8210, suica:4560, sbi:1620000, rakutensec:540000, dc1:2130000, dc2:860000, amazonpt:1240, rakutenpt:8930, jcbpt:412, ana:23400, jal:8800 };
    s.categories.forEach(c => { if (BUD[c.id] !== undefined && c.budget === BUD[c.id]) c.budget = 0; });
    s.accounts.forEach(a => { if (BAL[a.id] !== undefined && a.balance === BAL[a.id]) a.balance = 0; });
    const hadSample = s.tx.some(x => x.src === 'sample');
    s.tx = s.tx.filter(x => x.src !== 'sample');
    if (s.sample || hadSample) { s.history = []; s.lastImport = Object.fromEntries(Object.entries(s.lastImport || {}).filter(([id]) => s.tx.some(x => x.acct === id && x.src !== 'sample'))); }
    s.sample = false;

};

  let from = s.schema || 1;
  while (from < SCHEMA) { s = MIGRATIONS[from](s); from++; s.schema = from; }
  if (s.appVersion !== VERSION) { s.prevVersion = s.appVersion; s.appVersion = VERSION; s.whatsNew = true; }
  return s;
}

/* ---------- money maths ---------- */
function cardDebt(state, a){
  const td = today0(), key = mk(iso(td)), prev = addMonths(key, -1);
  const spentIn = k => -sum(state.tx.filter(x => x.acct === a.id && mk(x.date) === k && x.amt < 0), x => x.amt);
  return spentIn(key) + (td.getDate() < (a.payDay || 27) ? spentIn(prev) : 0);
}
function acctValue(state, a){
  if (a.type === 'card') return -cardDebt(state, a);
  if (a.type === 'points' || a.type === 'miles') return a.balance * (a.rate || 0);
  return a.balance;
}
function netWorth(state){ return sum(state.accounts.filter(a => !a.hidden), a => acctValue(state, a)); }
const liveAccts = () => S.accounts.filter(a => !a.hidden);

function settleCalc(book, key){
  const mem = S.books[book].members; const list = txIn(book, key).filter(isExp);

  const paid = mem.map(m => ({ m, p: -sum(list.filter(x => x.payer === m.id), x => x.amt) }));

  const debtor = [...paid].sort((a,b) => a.bal - b.bal)[0], creditor = [...paid].sort((a,b) => b.bal - a.bal)[0];
  return { total, share, paid, debtor, creditor };
}

let sorterRule = true;
function openSorter(){
  let queue = unreadList().map(x => x.id), i = 0;

    const box = sh.querySelector('#sorter');

        </div>
        <h5>${esc(t('pickCat'))}</h5>

        <div class="btnrow" style="margin-top:14px"><button type="button" class="btn ghost" id="s-later" style="flex:1">${esc(t('later'))}</button><button type="button" class="btn" id="s-ok" style="flex:2" ${x.cat === 'uncat' ? 'disabled' : ''}>${esc(x.cat === 'uncat' ? t('pickFirst') : t('keepOk'))}</button></div>
        <button type="button" class="btn ghost mt" id="s-all" style="background:none;color:var(--fg-2);height:44px">${esc(t('markAllRead'))}</button>`;
    };
    const decide = (x, catId) => {
      x.cat = catId; x.rev = true; let n = 0;
      if (sorterRule && catId !== 'uncat' && x.desc) {
        S.rules = S.rules.filter(r => r.kw !== x.desc); S.rules.unshift({ kw: x.desc, cat: catId });

      }

        S.tx.forEach(z => { if (z.rev === false) z.rev = true; }); persist(); render(); i = queue.length; draw(); }
    });
    next();
  });
}

/* charts */
let pendingCharts = [];
function lineChart(id, { labels, series, height = 210, minZero = true, fmtX = l => l, fmtV = v => yen(v) }){
  const W = 600, H = height, pl = 6, pr = 118, pt = 16, pb = 30;
  const vals = series.flatMap(s => s.values.filter(v => v != null));
  let max = Math.max(...vals), min = minZero ? 0 : Math.min(...vals);
  const span = (max - min) || 1; max += span * .08; if (!minZero) min -= span * .12;
  const n = labels.length, x = i => pl + i * (W - pl - pr) / Math.max(1, n - 1), y = v => pt + (H - pt - pb) * (1 - (v - min) / (max - min));
  const grid = [0, .5, 1].map(f => { const gy = pt + (H - pt - pb) * f; return `<line class="grid" x1="${pl}" x2="${W - pr + 4}" y1="${gy}" y2="${gy}"/>`; }).join('');
  const ticks = [0, Math.floor((n-1)/2), n-1].map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n-1 ? 'end' : 'middle'}">${esc(fmtX(labels[i], i))}</text>`).join('');
  const ends = [];
  const paths = series.map((s, si) => {
    const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    if (!pts.length) return '';
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    const last = pts[pts.length - 1]; ends.push({ y:last[1], x:last[0], s, v:s.values.filter(v => v != null).slice(-1)[0] });
    const area = s.area ? `<path d="${d}L${last[0]} ${H - pb}L${pts[0][0]} ${H - pb}Z" fill="url(#g-${id}-${si})"/>` : '';
    return `<defs><linearGradient id="g-${id}-${si}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".32"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash ? 2.5 : 3.5}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="7 7"' : ''}/>`;
  }).join('');
  ends.sort((a,b) => a.y - b.y); for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i-1].y < 44) ends[i].y = ends[i-1].y + 44;
  const endMarks = ends.map(e => `<circle cx="${e.x}" cy="${e.s.values.filter(v=>v!=null).length ? y(e.v) : e.y}" r="6" fill="${e.s.color}" stroke="#1a1424" stroke-width="3"/><text class="lab" x="${W - pr + 14}" y="${e.y - 2}">${esc(e.s.name)}</text><text x="${W - pr + 14}" y="${e.y + 20}" class="tnum">${esc(fmtV(e.v))}</text>`).join('');
  pendingCharts.push(() => {
    const el = document.getElementById(id); if (!el) return;
    const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cross = el.querySelector('.cross'), dots = el.querySelectorAll('.hd');
    const move = e => {
      const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * W;
      const i = Math.max(0, Math.min(n - 1, Math.round((px - pl) / ((W - pl - pr) / Math.max(1, n - 1)))));
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.style.opacity = 1;
      series.forEach((s, si) => { const v = s.values[i]; const dEl = dots[si]; if (v == null) { dEl.style.opacity = 0; return; } dEl.setAttribute('cx', x(i)); dEl.setAttribute('cy', y(v)); dEl.style.opacity = 1; });
      tip.innerHTML = `<div class="faint">${esc(fmtX(labels[i], i, true))}</div>` + series.filter(s => s.values[i] != null).map(s => `<div><span class="sw" style="background:${s.color}"></span>${esc(s.name)} <b class="tnum">${esc(fmtV(s.values[i]))}</b></div>`).join('');
      const left = x(i) / W * r.width; tip.style.left = Math.max(70, Math.min(r.width - 70, left)) + 'px'; tip.classList.add('on');
    };
    const out = () => { tip.classList.remove('on'); cross.style.opacity = 0; dots.forEach(d => d.style.opacity = 0); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerdown', move); el.addEventListener('pointerleave', out);
  });
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.name).join(', '))}">${grid}${paths}${endMarks}${ticks}
    <line class="cross" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="rgba(255,255,255,.35)" stroke-width="1.5" style="opacity:0"/>
    ${series.map(s => `<circle class="hd" r="7" fill="${s.color}" stroke="#1a1424" stroke-width="3" style="opacity:0"/>`).join('')}</svg><div class="tip"></div></div>`;
}

/* Insights */
function viewInsights(){
  const b = S.activeBook, key = UI.month, prevKey = addMonths(key, -1);
  const cur = mk(iso(today0())) === key;
  const cum = (k, upto) => { const days = daysIn(k), arr = []; let acc = 0; const list = txIn(b, k).filter(isExp);
    for (let d = 1; d <= days; d++) { acc += -sum(list.filter(x => +x.date.slice(8) === d), x => x.amt); arr.push(d <= upto ? acc : null); } return arr; };
  const thisArr = cum(key, cur ? today0().getDate() : daysIn(key)), lastArr = cum(prevKey, daysIn(prevKey));
  const n = Math.max(thisArr.length, lastArr.length); while (thisArr.length < n) thisArr.push(null); while (lastArr.length < n) lastArr.push(null);
  const spent = thisArr.filter(v => v != null).slice(-1)[0] || 0;
  const lastSame = lastArr[(cur ? today0().getDate() : daysIn(key)) - 1] ?? lastArr.filter(v => v != null).slice(-1)[0];
  const diff = spent - (lastSame || 0);
  const months = Array.from({length:6}, (_,i) => addMonths(key, i - 5));
  const incomeOf = k => sum(txIn(b, k).filter(isInc), x => x.amt), expOf = k => -sum(txIn(b, k).filter(isExp), x => x.amt);
  const incs = months.map(incomeOf), nets = months.map(k => incomeOf(k) - expOf(k));
  const maxInc = Math.max(1, ...incs), maxNet = Math.max(1, ...nets.map(Math.abs));
  const mShort = k => L()==='en' ? new Date(+k.slice(0,4), +k.slice(5)-1, 1).toLocaleDateString('en-GB',{month:'short'}) : `${+k.slice(5)}月`;
  const byCat = {}; txIn(b, key).filter(isExp).forEach(x => byCat[x.cat] = (byCat[x.cat] || 0) - x.amt);
  const cats = S.categories.filter(c => c.type === 'exp' && (byCat[c.id] || (b === 'personal' && c.budget))).map(c => ({ c, v: byCat[c.id] || 0 })).sort((a,b2) => b2.v - a.v);
  const maxCat = Math.max(1, ...cats.map(o => Math.max(o.v, b === 'personal' ? o.c.budget || 0 : 0)));
  const chart = lineChart('spendchart', {
    labels: Array.from({length:n}, (_,i) => i + 1),
    series: [ { name:t('lastMonth'), values:lastArr, color:'rgba(246,243,250,.45)', dash:true }, { name: cur ? t('thisMonth') : mShort(key), values:thisArr, color:'#f4c542', area:true } ],
    fmtX: (l, i, long) => L()==='en' ? `${long ? 'Day ' : ''}${l}` : `${l}日`
  });
  return `<h1 class="pg">${esc(t('insights'))}</h1>
  <div class="pgsub">${bookSwitch()}${monthSwitch()}</div>
  <div class="stack">
    <div class="card">
      <div class="eyebrow">${esc(t('spent'))}</div>
      <div class="val tnum">${yen(spent)}</div>
      <div class="kv tnum" style="justify-content:flex-start;margin:2px 0 12px"><span>${esc(t('lastMonth'))}${L()==='en' ? ', same point: ' : '同日比 '}<b class="${diff > 0 ? 'neg' : 'pos'}">${yen(diff, true)}</b></span></div>
      ${chart}
    </div>
    <div class="grid2">
      <div class="card"><div class="eyebrow">${esc(t('income'))}</div><div class="val tnum" style="font-size:22px">${yen(incs[5])}</div>
        <div class="minibars">${incs.map((v,i) => `<div class="${i === 5 ? 'cur' : ''}" style="height:${Math.max(4, v / maxInc * 100)}%" data-tip="${esc(mShort(months[i]))} ${yen(v)}"></div>`).join('')}</div></div>
      <div class="card"><div class="eyebrow">${esc(t('net'))}</div><div class="val tnum ${nets[5] >= 0 ? 'pos' : 'neg'}" style="font-size:22px">${yen(nets[5], true)}</div>
        <div class="minibars">${nets.map((v,i) => `<div class="${v >= 0 ? 'posb' : 'negb'}" style="height:${Math.max(4, Math.abs(v) / maxNet * 100)}%;opacity:${i === 5 ? 1 : .55}" data-tip="${esc(mShort(months[i]))} ${yen(v, true)}"></div>`).join('')}</div></div>
    </div>
    <div class="card">
      <div class="ctitle"><h3>${esc(t('byCategory'))}${b === 'personal' ? ` · ${esc(t('vsBudget'))}` : ''}</h3>${b === 'personal' ? `<button class="more" data-act="cats">${esc(t('budget'))}</button>` : ''}</div>
      ${cats.map(({c, v}) => { const bud = b === 'personal' ? c.budget || 0 : 0; const over = bud && v > bud;
        return `<div class="catrow"><div class="top2"><span class="nm">${esc(L()==='en' ? c.en : c.ja)}${over ? `<em>${esc(t('over'))} ${yen(v - bud)}</em>` : ''}</span><span class="amt tnum">${yen(v)}${bud ? `<small> / ${yen(bud)}</small>` : ''}</span></div>
        <div class="meter"><i class="${over ? 'over' : ''}" style="width:${Math.min(100, (bud ? v / bud : v / maxCat) * 100)}%"></i></div></div>`; }).join('')}
    </div>
  </div>`;
}

/* Assets */
function viewAssets(){
  const nw = netWorth(S);
  const hist = [...S.history, { m: mk(iso(today0())), v: nw }];
  const mShort = k => L()==='en' ? new Date(+k.slice(0,4), +k.slice(5)-1, 1).toLocaleDateString('en-GB',{month:'short'}) : `${+k.slice(5)}月`;
  const chart = hist.length < 2 ? `<p class="muted" style="margin:0">${esc(t('trendEmpty'))}</p>` : lineChart('nwchart', { labels: hist.map(h => h.m), series: [{ name:t('netWorth'), values: hist.map(h => h.v), color:'#9c8bff', area:true }], minZero:false, height:200,
    fmtX: (m, i, long) => long ? monthLabel(m) : mShort(m), fmtV: v => L()==='en' ? '¥' + (v/1e6).toFixed(2) + 'M' : '¥' + Math.round(v/10000).toLocaleString('ja-JP') + '万' });
  const order = ['bank','cash','emoney','invest','pension','card','points','miles'];
  const groups = order.map(tp => ({ tp, items: liveAccts().filter(a => a.type === tp) })).filter(g => g.items.length);
  const posTotal = sum(liveAccts().filter(a => !['card','points','miles'].includes(a.type)), a => acctValue(S, a));
  const td = today0();
  const upcoming = liveAccts().filter(a => a.type === 'card' && a.payDay).map(a => {
    const key = mk(iso(td)); const before = td.getDate() < a.payDay;
    const k = before ? addMonths(key, -1) : key;
    const amt = -sum(S.tx.filter(x => x.acct === a.id && mk(x.date) === k && x.amt < 0), x => x.amt);
    const dueKey = before ? key : addMonths(key, 1);
    return { a, amt, due: `${dueKey}-${pad(a.payDay)}`, pending: !before };
  });
  const subsMap = {}; S.tx.filter(x => x.cat === 'subs' && x.book === 'personal').forEach(x => { (subsMap[x.desc] ||= []).push(x); });
  const subs = Object.entries(subsMap).filter(([,l]) => new Set(l.map(x => mk(x.date))).size >= 2).map(([d,l]) => { l.sort((a,b) => b.date.localeCompare(a.date)); return { d, amt:-l[0].amt, acct:l[0].acct, last:l[0].date }; });
  const subsCard = subs.length ? `<div class="card"><div class="ctitle"><h3>${esc(t('subs'))}</h3><span class="tnum muted">${yen(sum(subs, s => s.amt))} / ${esc(t('perMonth'))}</span></div>
      <div class="rows">${subs.map(s => `<div class="row"><span class="av">${esc(s.d.slice(0,1))}</span><span class="main"><span class="t1">${esc(s.d)}</span><span class="t2">${esc(acct(s.acct)?.name || '')}</span></span><span class="amt tnum">${yen(s.amt)}</span></div>`).join('')}</div></div>` : '';
  const lastImp = id => S.lastImport[id] ? t('daysAgo', daysBetween(new Date(S.lastImport[id]), new Date())) : t('notImported');
  return `<h1 class="pg">${esc(t('assets'))}</h1>
  <div class="pgsub"><span class="booksw" style="font-size:16px">${esc(t('personal'))}</span><button class="btn sm ghost" data-act="addacct">${ic('plus','style="width:16px;height:16px"')} ${esc(t('addAcct'))}</button></div>
  <div class="stack">
    <div class="card"><div class="eyebrow">${esc(t('netWorth'))}</div><div class="val tnum">${yen(nw)}</div><div style="height:12px"></div>${chart}</div>
    <div class="card">
      <div class="ctitle"><h3>${esc(t('breakdown'))}</h3></div>
      ${groups.filter(g => !['card','points','miles'].includes(g.tp)).map(g => { const v = sum(g.items, a => acctValue(S, a));
        return `<div class="catrow"><div class="top2"><span class="nm">${esc(TYPE_LABEL[L()][g.tp])}</span><span class="amt tnum">${yen(v)} <small>${(v / posTotal * 100).toFixed(1)}%</small></span></div><div class="meter"><i style="width:${v / posTotal * 100}%;background:var(--violet)"></i></div></div>`; }).join('')}
    </div>
    <div class="card">
      <div class="ctitle"><h3>${esc(t('upcoming'))}</h3></div>
      <div class="rows">${upcoming.map(u => `<div class="row"><span class="av">${esc(u.a.name.slice(0,1))}</span><span class="main"><span class="t1">${esc(u.a.name)}</span><span class="t2">${esc(dayLabel(u.due))}${u.pending ? ` · ${esc(t('estimated'))}` : ''}</span></span><span class="amt tnum">${yen(-u.amt)}</span></div>`).join('')}</div>
    </div>
    ${groups.map(g => `<div class="card"><div class="ctitle"><h3>${esc(TYPE_LABEL[L()][g.tp])}</h3>${['points','miles'].includes(g.tp) ? `<span class="faint" style="font-size:13px">${g.items.some(a => a.rate) ? '' : esc(t('notCounted'))}</span>` : ''}</div><div class="rows">${g.items.map(a => {
        const val = ['points','miles'].includes(a.type) ? `${a.balance.toLocaleString('ja-JP')} ${a.unit}` : yen(acctValue(S, a));
        const sub = ['points','miles'].includes(a.type) ? (a.rate ? `≈ ${yen(a.balance * a.rate)}` : t('notCounted')) : `${t('lastImport')} ${lastImp(a.id)}`;
        return `<button class="row" data-act="acct" data-arg="${a.id}"><span class="av">${esc(a.name.slice(0,1))}</span><span class="main"><span class="t1">${esc(a.name)}</span><span class="t2">${esc(sub)}</span></span><span class="amt tnum">${esc(val)}</span>${ic('chev','class="chev"')}</button>`; }).join('')}</div></div>`).join('')}
    ${subsCard}
    <button class="btn ghost" data-act="addacct">${ic('plus','style="width:18px;height:18px"')} ${esc(t('addAcct'))}</button>
    ${S.accounts.some(a => a.hidden) ? `<button class="btn ghost" style="background:none;color:var(--fg-2)" data-act="hiddenaccts">${esc(t('hiddenAccts', S.accounts.filter(a => a.hidden).length))}</button>` : ''}
  </div>`;
}

/* ---------- sheets ---------- */
function openSheet(html, mount){
  closeSheet(true);
  const s = document.createElement('div'); s.className = 'scrim'; s.id = 'scrim';
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  s.addEventListener('click', e => { if (e.target === s) closeSheet(); });
  document.body.appendChild(s); requestAnimationFrame(() => s.classList.add('on'));
  if (mount) mount(s.querySelector('.sheet'));
}
function closeSheet(now){ const s = $('#scrim'); if (!s) return; if (now) { s.remove(); return; } s.classList.remove('on'); setTimeout(() => s.remove(), 200); }

function catOptions(type, sel){ return S.categories.filter(c => c.type === type || (type === 'exp' && c.id === 'uncat')).filter((c,i,a) => a.indexOf(c) === i).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(L()==='en' ? c.en : c.ja)}</option>`).join(''); }
function ruleCat(desc){ const d = desc.toLowerCase(); const r = S.rules.find(r => r.kw && d.includes(r.kw.toLowerCase())); return r ? r.cat : null; }

function openTx(id){
  const x = id ? S.tx.find(z => z.id === id) : null;
  const book = x ? x.book : S.activeBook;
  let type = x ? (isXfer(x) ? 'xfer' : x.amt > 0 ? 'inc' : 'exp') : 'exp';
  const shared = book !== 'personal';
  const acctOpts = liveAccts().filter(a => ['bank','cash','card','emoney','invest'].includes(a.type)).map(a => `<option value="${a.id}" ${(x ? x.acct : 'cash') === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('');
  const memOpts = (S.books[book].members || []).map(m => `<option value="${m.id}" ${(x ? x.payer : 'me') === m.id ? 'selected' : ''}>${esc(L()==='en' ? m.en : m.ja)}</option>`).join('');
  openSheet(`<h2>${esc(t(x ? 'editTx' : 'newTx'))}</h2><p class="lead">${esc(t(book))}</p>
    <form class="form" id="txf">
      <div class="seg" id="tseg">${['exp','inc','xfer'].filter(k => !shared || k === 'exp').map(k => `<button type="button" data-t="${k}" aria-pressed="${k === type}">${esc(t({exp:'expense',inc:'income',xfer:'transfer'}[k]))}</button>`).join('')}</div>
      <input class="inp amtin tnum" id="f-amt" inputmode="numeric" placeholder="¥0" value="${x ? Math.abs(x.amt).toLocaleString('ja-JP') : ''}" aria-label="${esc(t('amount'))}">
      <label>${esc(t('desc'))}<input class="inp" id="f-desc" value="${esc(x ? x.desc : '')}" autocomplete="off"></label>
      <div class="two"><label>${esc(t('date'))}<input class="inp" id="f-date" type="date" value="${x ? x.date : iso(today0())}"></label>
      <label>${esc(t('category'))}<select class="inp" id="f-cat">${catOptions(type, x ? x.cat : (type === 'exp' ? 'food' : 'salary'))}</select></label></div>
      ${shared ? `<label>${esc(t('payer'))}<select class="inp" id="f-payer">${memOpts}</select></label>` : `<label>${esc(t('account'))}<select class="inp" id="f-acct">${acctOpts}</select></label>`}
      <label>${esc(t('memo'))}<input class="inp" id="f-memo" value="${esc(x?.memo || '')}"></label>
      <label class="check"><input type="checkbox" id="f-rule"> ${esc(t('learnRule'))}</label>
      <div class="btnrow">${x ? `<button type="button" class="btn danger" id="f-del" style="flex:1">${esc(t('del'))}</button>` : ''}<button class="btn" style="flex:2">${esc(t('save'))}</button></div>
    </form>`, sh => {
    const amt = sh.querySelector('#f-amt'), desc = sh.querySelector('#f-desc'), catSel = sh.querySelector('#f-cat');
    sh.querySelector('#tseg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; type = b.dataset.t;
      sh.querySelectorAll('#tseg button').forEach(z => z.setAttribute('aria-pressed', z === b)); catSel.innerHTML = catOptions(type, type === 'exp' ? 'food' : type === 'inc' ? 'salary' : 'transfer'); });
    amt.addEventListener('input', () => { const v = amt.value.replace(/[^\d]/g,''); amt.value = v ? (+v).toLocaleString('ja-JP') : ''; });
    desc.addEventListener('change', () => { const c = ruleCat(desc.value); if (c && type === 'exp') catSel.value = c; });
    if (!x) setTimeout(() => amt.focus(), 250);
    const del = sh.querySelector('#f-del');
    if (del) del.addEventListener('click', () => { if (!del.dataset.arm) { del.dataset.arm = 1; del.textContent = t('delConfirm'); return; } S.tx = S.tx.filter(z => z.id !== x.id); persist(); closeSheet(); render(); toast(t('deleted')); });
    sh.querySelector('#txf').addEventListener('submit', e => { e.preventDefault();
      const v = +amt.value.replace(/[^\d]/g,''); if (!v) { amt.focus(); return; }
      const c = catSel.value; const d = desc.value.trim() || catName(c);
      const rec = { id: x ? x.id : uid(), date: sh.querySelector('#f-date').value || iso(today0()), desc: d, amt: type === 'inc' ? v : -v, cat: c, book, memo: sh.querySelector('#f-memo').value.trim(), src: x ? x.src : 'manual', rev: true };
      if (shared) { rec.payer = sh.querySelector('#f-payer').value; rec.acct = null; } else rec.acct = sh.querySelector('#f-acct').value;
      if (x) Object.assign(x, rec); else S.tx.push(rec);
      if (sh.querySelector('#f-rule').checked && desc.value.trim()) { S.rules = S.rules.filter(r => r.kw !== desc.value.trim()); S.rules.unshift({ kw: desc.value.trim(), cat: c }); }
      persist(); closeSheet(); render(); toast(t('saved')); });
  });
}

/* CSV */
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c; }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}
function normDate(s){
  s = (s||'').trim(); let m;
  if ((m = s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if ((m = s.match(/^(\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/))) return `20${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  return null;
}
const num = s => { const v = String(s ?? '').replace(/[¥,円\s"]/g,'').replace(/^[(（](.*)[)）]$/,'-$1').replace('▲','-').replace('△','-'); return v === '' || isNaN(+v) ? null : +v; };
const MF_MAP = { '食費':'food','日用品':'daily','住宅':'home','水道・光熱費':'util','通信費':'phone','交通費':'transit','自動車':'transit','交際費':'social','趣味・娯楽':'outdoor','衣服・美容':'beauty','健康・医療':'health','教養・教育':'learn','特別な支出':'other','その他':'other','税・社会保障':'other','保険':'other','現金・カード':'transfer','未分類':'uncat' };
function decodeFile(buf){
  let txt = new TextDecoder('utf-8').decode(buf);
  if (txt.includes(String.fromCharCode(0xFFFD))) { try { txt = new TextDecoder('shift_jis').decode(buf); } catch(e){} }
  return txt.replace(/^﻿/, '');
}
function buildImport(text, target, posIsExp){
  const rows = parseCSV(text); if (!rows.length) return { err:true };
  let hi = rows.findIndex(r => r.some(c => /日付|利用日|取引日|date/i.test(c)));
  if (hi < 0) return { err:true };
  const H = rows[hi].map(h => h.trim());
  const col = re => H.findIndex(h => re.test(h));
  const isMF = H.includes('計算対象') && H.some(h => h.includes('保有金融機関'));
  const out = [];
  const known = new Set(S.tx.map(x => x.extId).filter(Boolean));
  const sig = new Set(S.tx.map(x => `${x.date}|${x.amt}|${x.desc}`));
  let dupes = 0;
  for (const r of rows.slice(hi + 1)) {
    if (isMF) {
      const g = n => r[col(new RegExp('^' + n))] ?? '';
      const date = normDate(g('日付')); const amt = num(g('金額')); if (!date || amt == null) continue;
      const desc = g('内容').trim(); const inst = g('保有金融機関').trim(); const big = g('大項目').trim(), mid = g('中項目').trim();
      const ext = g('ID').trim();
      let c = ruleCat(desc) || (big === '収入' ? (mid === '給与' ? 'salary' : 'incother') : MF_MAP[big] || 'uncat');
      if (g('振替').trim() === '1' || g('計算対象').trim() === '0') c = 'transfer';
      let a = S.accounts.find(z => inst && (z.name.includes(inst) || inst.includes(z.name.replace(/[（(].*$/,''))));
      const rec = { id:uid(), date, desc: desc || inst, amt, cat:c, book:'personal', acct: a ? a.id : null, acctName: a ? null : inst, extId: ext ? 'mf:' + ext : null, memo: g('メモ').trim(), src:'mf' };
      if ((rec.extId && known.has(rec.extId)) || sig.has(`${date}|${amt}|${rec.desc}`)) { dupes++; continue; }
      out.push(rec);
    } else {
      const di = col(/日付|利用日|取引日|date/i), ds = col(/内容|摘要|利用店名|ご利用店名|ご利用先|取引内容|お取引内容|説明|description/i);
      const ai = col(/^(?!.*入金).*(利用金額|ご利用金額|支払金額|金額|amount)/i), outI = col(/出金|お引出し|引出/), inI = col(/入金|お預入れ|預入/);
      if (di < 0 || (ai < 0 && outI < 0)) return { err:true };
      const date = normDate(r[di]); if (!date) continue;
      let amt;
      if (outI >= 0 || inI >= 0) { const o = num(r[outI]) || 0, i2 = num(r[inI]) || 0; amt = i2 - o; if (!amt) continue; }
      else { const v = num(r[ai]); if (v == null) continue; amt = posIsExp ? -v : v; }
      const desc = (r[ds] || '').trim();
      const c = ruleCat(desc) || (amt > 0 ? 'incother' : 'uncat');
      if (sig.has(`${date}|${amt}|${desc}`)) { dupes++; continue; }
      out.push({ id:uid(), date, desc, amt, cat:c, book:'personal', acct:target, src:'csv' });
    }
  }
  out.forEach(x => { x.rev = false; });
  return { isMF, out, dupes };
}

        <button class="btn mt" id="i-go" ${result.out.length ? '' : 'disabled'}>${esc(t('doImport', result.out.length))}</button>`;
      sh.querySelector('#i-go').addEventListener('click', () => {
        result.out.forEach(x => { if (!x.acct && x.acctName) { let a = S.accounts.find(z => z.name === x.acctName); if (!a) { a = { id:'a' + uid(), name:x.acctName, type:'bank', balance:0, unit:null, rate:null, payDay:null }; S.accounts.push(a); } x.acct = a.id; } delete x.acctName; });
        S.tx.push(...result.out);
        new Set(result.out.map(x => x.acct)).forEach(id => { if (id) S.lastImport[id] = new Date().toISOString(); });
        const ds = result.out.map(x => x.date).sort(); const first = ds[0], last = ds[ds.length - 1];
        persist(); closeSheet(); UI.bannerHidden = true; UI.tab = 'tx'; UI.filter = 'all'; UI.q = ''; S.activeBook = 'personal'; UI.month = mk(last); render(); scrollTo(0,0);
        toast(t('importedRange', result.out.length, monthLabel(mk(first)), monthLabel(mk(last))));
        if (result.out.length) setTimeout(openSorter, 450);
      });
    };
    sh.querySelector('#i-file').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; fileText = decodeFile(await f.arrayBuffer()); run(); });
    sh.querySelector('#i-acct').addEventListener('change', run); sh.querySelector('#i-pos').addEventListener('change', run);
  });
}

<script>
(function(){
  if(!('serviceWorker' in navigator)) return;
  var lang='ja'; try{ lang=(JSON.parse(localStorage.getItem('kura.meta.v1')||'{}').lang)||'ja'; }catch(e){}
  function banner(w){
    if(document.querySelector('.upd')) return;
    var b=document.createElement('div'); b.className='upd'; b.setAttribute('role','status');
    b.innerHTML=(lang==='en'?'A new version is ready':'新しいバージョンがあります')+'<button type="button">'+(lang==='en'?'Update':'更新する')+'</button>';
    b.querySelector('button').onclick=function(){ w.postMessage('skip'); };
    document.body.appendChild(b);
  }
  var reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(reloading) return; reloading=true; location.reload(); });
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.waiting && navigator.serviceWorker.controller) banner(reg.waiting);
      reg.addEventListener('updatefound',function(){ var w=reg.installing; if(!w) return;
        w.addEventListener('statechange',function(){ if(w.state==='installed' && navigator.serviceWorker.controller) banner(w); }); });
      setInterval(function(){ reg.update().catch(function(){}); }, 60*60*1000);
      document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') reg.update().catch(function(){}); });
    }).catch(function(){});
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
  });
})();
</script>
